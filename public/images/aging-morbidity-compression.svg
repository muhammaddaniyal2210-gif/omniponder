<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Two lives of equal length compared: in the first, illness stretches across a long final period; in the second, healthy years extend and illness is compressed into a short interval before death.">
  <rect width="1600" height="900" fill="#fbfaf7"/>

  <text x="100" y="90" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#171614" letter-spacing="-0.5">The Prize Is Healthspan, Not Lifespan</text>
  <line x1="100" y1="118" x2="1500" y2="118" stroke="#c8c2b4" stroke-width="1"/>
  <text x="100" y="148" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#77736a">THE SAME LENGTH OF LIFE, LIVED TWO WAYS</text>

  <!-- Shared time axis -->
  <!-- bar geometry: x from 200 to 1400 (=1200px = a whole life ~ birth to ~85). -->
  <text x="200" y="235" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#a89f8c">BIRTH</text>
  <text x="1400" y="235" text-anchor="end" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#a89f8c">DEATH</text>

  <!-- ROW 1: today — long decline -->
  <text x="200" y="300" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#171614" font-weight="600">TODAY — A LONG DECLINE</text>
  <!-- healthy segment (charcoal) birth->~65% -->
  <rect x="200" y="322" width="820" height="86" fill="#171614"/>
  <!-- illness segment (copper) ~last third -->
  <rect x="1020" y="322" width="380" height="86" fill="#b8873f"/>
  <text x="610" y="375" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#fbfaf7">healthy years</text>
  <text x="1210" y="372" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#3a3833">years of</text>
  <text x="1210" y="392" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#3a3833">illness &amp; decline</text>

  <!-- ROW 2: compressed morbidity -->
  <text x="200" y="500" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#b8873f" font-weight="600">THE GOAL — COMPRESSED ILLNESS</text>
  <rect x="200" y="522" width="1080" height="86" fill="#171614"/>
  <rect x="1280" y="522" width="120" height="86" fill="#b8873f"/>
  <text x="740" y="575" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#fbfaf7">healthy years, extended</text>
  <text x="1340" y="640" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="13" letter-spacing="1" fill="#8a6a2f">brief</text>

  <!-- alignment guide: same death line; dropline showing illness onset shifts right -->
  <line x1="1020" y1="322" x2="1020" y2="672" stroke="#c8c2b4" stroke-width="1" stroke-dasharray="5 6"/>
  <line x1="1280" y1="522" x2="1280" y2="672" stroke="#c8c2b4" stroke-width="1" stroke-dasharray="5 6"/>
  <path d="M 1030 690 L 1270 690" stroke="#b8873f" stroke-width="2"/>
  <path d="M 1262 682 L 1274 690 L 1262 698 Z" fill="#b8873f"/>
  <text x="1150" y="722" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#8a6a2f">illness pushed later</text>

  <text x="200" y="762" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="22" fill="#66625a">Not more years at the end, but fewer sick ones.</text>

  <!-- Footer -->
  <line x1="100" y1="828" x2="1500" y2="828" stroke="#e2ded4" stroke-width="1"/>
  <text x="100" y="862" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="3" fill="#77736a">OMNIPONDER — FIG. 01</text>
  <text x="1500" y="862" text-anchor="end" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5" fill="#77736a">COMPRESSION OF MORBIDITY · FRIES, 1980</text>
</svg>
