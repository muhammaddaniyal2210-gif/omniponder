<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232120"/>
      <stop offset="100%" stop-color="#131211"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fae7a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8fae7a" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c98b3f" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c98b3f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .lbl   { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; letter-spacing: 3.4px; fill: #d8d2c6; }
    .gold  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 19px; letter-spacing: 4px; fill: #c98b3f; }
    .micro { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: 2.2px; fill: #6f6a60; }
    .hud   { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; letter-spacing: 2.4px; fill: #8fae7a; }
    .dim   { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 2.2px; fill: #57534b; }
  </style>

  <rect width="1600" height="1600" fill="#0d0c0b"/>

  <g transform="translate(0,350)">
    <!-- canopy surround -->
    <rect x="0" y="0" width="1600" height="900" fill="#0d0c0b"/>
    <path d="M0 236 H1600" stroke="#2a2724" stroke-width="2"/>

    <!-- HUD glass -->
    <rect x="404" y="252" width="312" height="252" fill="url(#glass)" stroke="#8fae7a" stroke-opacity="0.35" stroke-width="1.4"/>
    <path d="M516 300 H546" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M574 300 H604" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M534 334 H546" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M574 334 H586" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M516 368 H546" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M574 368 H604" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M534 402 H546" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M574 402 H586" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M516 436 H546" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/><path d="M574 436 H604" stroke="#8fae7a" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M540 378 H580 M560 358 V398" stroke="#8fae7a" stroke-opacity="0.8" stroke-width="1.8"/>
    <rect x="516" y="334" width="88" height="88" fill="none" stroke="#8fae7a" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="9 7"/>
    <text class="hud" x="424" y="286">AUTO</text>
    <text class="hud" x="696" y="286" text-anchor="end">28 000</text>
    <text class="hud" x="424" y="490">M 0.82</text>
    <text class="hud" x="696" y="490" text-anchor="end">TRK 094</text>

    <!-- instrument panel -->
    <rect x="120" y="540" width="1360" height="300" fill="url(#panel)" stroke="#35312c" stroke-width="2"/>
    <path d="M120 596 H1480" stroke="#2a2724" stroke-width="1"/>

    
    <g>
      <circle cx="250" cy="700" r="62" fill="#101010" stroke="#4a4640" stroke-width="2"/>
      <circle cx="250" cy="700" r="54" fill="none" stroke="#2a2724" stroke-width="1"/>
      <path d="M250.0 643.0 L250.0 650.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M278.5 650.6 L275.0 656.7" stroke="#6f6a60" stroke-width="1.6"/><path d="M299.4 671.5 L293.3 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M307.0 700.0 L300.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M299.4 728.5 L293.3 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M278.5 749.4 L275.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M250.0 757.0 L250.0 750.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M221.5 749.4 L225.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M200.6 728.5 L206.7 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M193.0 700.0 L200.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M200.6 671.5 L206.7 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M221.5 650.6 L225.0 656.7" stroke="#6f6a60" stroke-width="1.6"/>
      <path d="M250 700 L226.5 734.8" stroke="#c98b3f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="250" cy="700" r="4" fill="#c98b3f"/>
      <text class="micro" x="250" y="788" text-anchor="middle">ATTITUDE</text>
    </g>
    
    <g>
      <circle cx="410" cy="700" r="62" fill="#101010" stroke="#4a4640" stroke-width="2"/>
      <circle cx="410" cy="700" r="54" fill="none" stroke="#2a2724" stroke-width="1"/>
      <path d="M410.0 643.0 L410.0 650.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M438.5 650.6 L435.0 656.7" stroke="#6f6a60" stroke-width="1.6"/><path d="M459.4 671.5 L453.3 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M467.0 700.0 L460.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M459.4 728.5 L453.3 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M438.5 749.4 L435.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M410.0 757.0 L410.0 750.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M381.5 749.4 L385.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M360.6 728.5 L366.7 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M353.0 700.0 L360.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M360.6 671.5 L366.7 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M381.5 650.6 L385.0 656.7" stroke="#6f6a60" stroke-width="1.6"/>
      <path d="M410 700 L443.1 725.9" stroke="#c98b3f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="410" cy="700" r="4" fill="#c98b3f"/>
      <text class="micro" x="410" y="788" text-anchor="middle">AIRSPEED</text>
    </g>
    
    <g>
      <circle cx="1330" cy="700" r="62" fill="#101010" stroke="#4a4640" stroke-width="2"/>
      <circle cx="1330" cy="700" r="54" fill="none" stroke="#2a2724" stroke-width="1"/>
      <path d="M1330.0 643.0 L1330.0 650.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1358.5 650.6 L1355.0 656.7" stroke="#6f6a60" stroke-width="1.6"/><path d="M1379.4 671.5 L1373.3 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1387.0 700.0 L1380.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1379.4 728.5 L1373.3 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1358.5 749.4 L1355.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M1330.0 757.0 L1330.0 750.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1301.5 749.4 L1305.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M1280.6 728.5 L1286.7 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1273.0 700.0 L1280.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1280.6 671.5 L1286.7 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1301.5 650.6 L1305.0 656.7" stroke="#6f6a60" stroke-width="1.6"/>
      <path d="M1330 700 L1294.4 677.7" stroke="#c98b3f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="1330" cy="700" r="4" fill="#c98b3f"/>
      <text class="micro" x="1330" y="788" text-anchor="middle">FUEL FLOW</text>
    </g>
    
    <g>
      <circle cx="1170" cy="700" r="62" fill="#101010" stroke="#4a4640" stroke-width="2"/>
      <circle cx="1170" cy="700" r="54" fill="none" stroke="#2a2724" stroke-width="1"/>
      <path d="M1170.0 643.0 L1170.0 650.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1198.5 650.6 L1195.0 656.7" stroke="#6f6a60" stroke-width="1.6"/><path d="M1219.4 671.5 L1213.3 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1227.0 700.0 L1220.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1219.4 728.5 L1213.3 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1198.5 749.4 L1195.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M1170.0 757.0 L1170.0 750.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1141.5 749.4 L1145.0 743.3" stroke="#6f6a60" stroke-width="1.6"/><path d="M1120.6 728.5 L1126.7 725.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1113.0 700.0 L1120.0 700.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1120.6 671.5 L1126.7 675.0" stroke="#6f6a60" stroke-width="1.6"/><path d="M1141.5 650.6 L1145.0 656.7" stroke="#6f6a60" stroke-width="1.6"/>
      <path d="M1170 700 L1200.2 670.8" stroke="#c98b3f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="1170" cy="700" r="4" fill="#c98b3f"/>
      <text class="micro" x="1170" y="788" text-anchor="middle">ENGINE</text>
    </g>

    <!-- the switch: the subject of the essay -->
    <circle cx="790" cy="700" r="150" fill="url(#glow)"/>
    <rect x="656" y="612" width="268" height="176" fill="#191817" stroke="#4a4640" stroke-width="2"/>
    <text class="micro" x="790" y="644" text-anchor="middle">FLIGHT CONTROL AUTHORITY</text>

    <!-- toggle track -->
    <rect x="694" y="672" width="192" height="56" rx="0" fill="#0f0e0d" stroke="#3a3630" stroke-width="1.6"/>
    <text class="micro" x="716" y="754">MANUAL</text>
    <text class="micro" x="866" y="754" text-anchor="end" fill="#c98b3f">AUTO</text>

    <!-- lever thrown to AUTO -->
    <path d="M742 700 L846 700" stroke="#2a2724" stroke-width="3"/>
    <path d="M790 700 L846 682" stroke="#c98b3f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="790" cy="700" r="11" fill="#8a8177" stroke="#c98b3f" stroke-width="2"/>
    <circle cx="850" cy="680" r="9" fill="#c98b3f"/>

    <text class="gold" x="790" y="800" text-anchor="middle">ENGAGED</text>

    <!-- control stick, unattended -->
    <path d="M790 900 L790 862" stroke="#35312c" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="790" cy="858" rx="26" ry="13" fill="#232120" stroke="#3f3a34" stroke-width="1.6"/>

    <!-- side labelling -->
    <text class="lbl" x="120" y="196">SUPERVISED AUTONOMY</text>
    <path d="M120 214 H520" stroke="#3a3630" stroke-width="1"/>
    <text class="dim" x="120" y="884">THE SEAT IS OCCUPIED — THE AUTHORITY IS NOT</text>
  </g>
</svg>
