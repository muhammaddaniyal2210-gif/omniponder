<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Left: the myth of a single gene for extraversion, crossed out. Right: what a million genomes show, over a thousand tiny variants each nudging a dial slightly toward outgoing">
  <rect width="1600" height="900" fill="#fbfaf7"/>

  <text x="100" y="90" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#171614" letter-spacing="-0.5">How a Personality Is (Not) Written</text>
  <line x1="100" y1="118" x2="1500" y2="118" stroke="#c8c2b4" stroke-width="1"/>
  <text x="100" y="148" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#77736a">THE HEADLINE, AND WHAT A MILLION GENOMES ACTUALLY SHOW</text>

  <!-- divider between panels -->
  <line x1="640" y1="200" x2="640" y2="800" stroke="#e2ded4" stroke-width="1"/>

  <!-- ===== LEFT: THE MYTH ===== -->
  <text x="100" y="238" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="19" letter-spacing="2" fill="#77736a" font-weight="600">THE HEADLINE VERSION</text>

  <g font-family="Georgia,'Times New Roman',serif">
    <!-- single gene box -->
    <rect x="120" y="300" width="360" height="120" fill="#171614"/>
    <text x="300" y="352" text-anchor="middle" font-size="24" fill="#fbfaf7">One &#8220;gene for</text>
    <text x="300" y="386" text-anchor="middle" font-size="24" fill="#fbfaf7">extraversion&#8221;</text>
    <!-- big arrow -->
    <path d="M 300 430 L 300 486" stroke="#171614" stroke-width="4"/>
    <path d="M 288 476 L 300 492 L 312 476 Z" fill="#171614"/>
    <!-- outcome -->
    <rect x="120" y="500" width="360" height="96" fill="none" stroke="#171614" stroke-width="2"/>
    <text x="300" y="556" text-anchor="middle" font-size="26" fill="#171614">An outgoing person</text>
  </g>
  <!-- crossed out -->
  <line x1="150" y1="600" x2="450" y2="300" stroke="#b8873f" stroke-width="4" opacity="0.85"/>
  <text x="300" y="662" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#8a6a2f">Not how it works.</text>

