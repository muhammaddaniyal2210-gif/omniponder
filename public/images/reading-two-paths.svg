<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Two paths through a text: deep reading versus delegated reading">
  <rect width="1600" height="900" fill="#fbfaf7"/>

  <!-- Title -->
  <text x="100" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#171614" letter-spacing="-0.5">Two Ways Through a Text</text>
  <line x1="100" y1="120" x2="1500" y2="120" stroke="#c8c2b4" stroke-width="1"/>
  <text x="100" y="150" font-family="'Inter Tight', 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="3" fill="#77736a">SAME PAGE · DIFFERENT MIND AT THE END</text>

  <!-- Shared start: THE TEXT -->
  <g font-family="'Inter Tight', 'Helvetica Neue', Arial, sans-serif">
    <rect x="640" y="200" width="320" height="70" fill="#171614"/>
    <text x="800" y="238" text-anchor="middle" font-size="20" letter-spacing="4" fill="#fbfaf7">THE TEXT</text>
    <text x="800" y="258" text-anchor="middle" font-size="13" letter-spacing="2" fill="#c8c2b4">A DIFFICULT ARGUMENT</text>
  </g>

  <!-- Split lines from text to the two columns -->
  <path d="M 760 270 L 380 330" fill="none" stroke="#171614" stroke-width="2"/>
  <path d="M 840 270 L 1220 330" fill="none" stroke="#b8873f" stroke-width="2"/>

  <!-- Column labels -->
  <text x="380" y="316" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="19" letter-spacing="3" fill="#171614" font-weight="600">DEEP READING</text>
  <text x="1220" y="316" text-anchor="middle" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="19" letter-spacing="3" fill="#b8873f" font-weight="600">DELEGATED READING</text>

  <!-- ============ LEFT PATH: DEEP READING ============ -->
  <g font-family="Georgia,'Times New Roman',serif">
    <!-- Step 1 -->
    <rect x="180" y="350" width="400" height="78" fill="none" stroke="#171614" stroke-width="1.5"/>
    <text x="205" y="384" font-size="24" fill="#171614">Sustained attention</text>
    <text x="205" y="412" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#66625a">you stay with the difficulty</text>
    <!-- connector -->
    <line x1="380" y1="428" x2="380" y2="470" stroke="#171614" stroke-width="1.5"/>
    <!-- Step 2 -->
    <rect x="180" y="470" width="400" height="78" fill="none" stroke="#171614" stroke-width="1.5"/>
    <text x="205" y="504" font-size="24" fill="#171614">The sequence, in order</text>
    <text x="205" y="532" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#66625a">every step of the reasoning</text>
    <line x1="380" y1="548" x2="380" y2="590" stroke="#171614" stroke-width="1.5"/>
    <!-- Step 3 -->
    <rect x="180" y="590" width="400" height="78" fill="none" stroke="#171614" stroke-width="1.5"/>
    <text x="205" y="624" font-size="24" fill="#171614">Inference &amp; doubt</text>
    <text x="205" y="652" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#66625a">you test it, argue back</text>
    <line x1="380" y1="668" x2="380" y2="710" stroke="#171614" stroke-width="1.5"/>
    <!-- Outcome -->
    <rect x="180" y="710" width="400" height="86" fill="#171614"/>
    <text x="205" y="748" font-size="26" fill="#fbfaf7">Your own judgment</text>
    <text x="205" y="778" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1.5" fill="#c8c2b4">A CONCLUSION YOU CAN DEFEND</text>
  </g>

  <!-- ============ RIGHT PATH: DELEGATED READING ============ -->
  <g font-family="Georgia,'Times New Roman',serif">
    <!-- Step 1: the machine -->
    <rect x="1020" y="350" width="400" height="78" fill="none" stroke="#b8873f" stroke-width="1.5"/>
    <text x="1045" y="384" font-size="24" fill="#171614">The machine reads it</text>
    <text x="1045" y="412" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1" fill="#66625a">seconds, no effort</text>
    <line x1="1220" y1="428" x2="1220" y2="470" stroke="#b8873f" stroke-width="1.5"/>

    <!-- The skipped middle -->
    <rect x="1020" y="470" width="400" height="198" fill="#f3f0e9" stroke="#c8c2b4" stroke-width="1" stroke-dasharray="6 6"/>
    <text x="1220" y="560" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="16" letter-spacing="3" fill="#77736a">THE SEQUENCE</text>
    <text x="1220" y="588" text-anchor="middle" font-family="'Inter Tight',sans-serif" font-size="16" letter-spacing="3" fill="#77736a">IS SKIPPED</text>
    <!-- strike-through gesture -->
    <line x1="1070" y1="500" x2="1370" y2="640" stroke="#b8873f" stroke-width="1.5" opacity="0.55"/>
    <line x1="1220" y1="668" x2="1220" y2="710" stroke="#b8873f" stroke-width="1.5"/>

    <!-- Outcome -->
    <rect x="1020" y="710" width="400" height="86" fill="none" stroke="#b8873f" stroke-width="2"/>
    <text x="1045" y="748" font-size="26" fill="#171614">A borrowed verdict</text>
    <text x="1045" y="778" font-family="'Inter Tight',sans-serif" font-size="14" letter-spacing="1.5" fill="#8a6a2f">NOTHING LEFT TO CROSS-EXAMINE</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="846" x2="1500" y2="846" stroke="#e2ded4" stroke-width="1"/>
  <text x="100" y="878" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="3" fill="#77736a">OMNIPONDER — FIG. 01</text>
  <text x="1500" y="878" text-anchor="end" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#77736a">THE SUMMARY ARRIVES WITHOUT THE PASSAGE</text>
</svg>
